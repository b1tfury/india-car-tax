services:
  - type: web
    name: india-car-tax
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -c "import base64,zlib,pathlib; p=pathlib.Path('static'); p.mkdir(exist_ok=True); p.joinpath('index.html').write_bytes(zlib.decompress(base64.b64decode(p.joinpath('ui.zlib.b64').read_text().strip())))"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
